name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài đặt
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Kiểm tra kiểu (domain + kb, strict)
        run: mypy

      - name: Kiểm tra hiệu lực đã suy diễn (idempotent)
        run: python scripts/suy_dien_hieu_luc.py --kiem-tra

      - name: Kiểm thử + độ phủ
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

      # Cổng chỉ số: bật lại từ PR #4 khi engine đã được port.
      # - name: Cổng đánh giá (Top-1 >= 0.7667)
      #   run: python eval/evaluate.py --gate-top1 0.7667
