name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài đặt
        run: |
          python -m pip install --upgrade pip
          # Kem 'bao-cao' va 'web': ca hai deu nhe, va thieu chung thi mypy coi
          # docx/fastapi la Any nen phep kiem kieu chi la hinh thuc, con test
          # thi tu skip. Khong cai 'dense' vi mo hinh ~470 MB.
          pip install -e ".[dev,bao-cao,web]"

      - name: Lint
        run: ruff check src tests

      - name: Kiểm tra kiểu (strict)
        run: mypy

      - name: Kiểm tra hiệu lực đã suy diễn (idempotent)
        run: python scripts/suy_dien_hieu_luc.py --kiem-tra

      - name: Kiểm thử + độ phủ
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Cổng đánh giá — Top-1 không được tụt dưới đường cơ sở
        run: python eval/evaluate.py --gate-top1 0.7667
