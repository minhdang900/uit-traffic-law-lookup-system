{#- Icon bộ Lucide vẽ inline, stroke-width 2.75 theo bản bàn giao. -#}
{% macro icon(name, cls="") %}<svg class="icon{{ ' ' ~ cls if cls }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == "search" %}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == "search-alert" %}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M11 8v3M11 14h.01"/>
{%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "layout-grid" %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
{%- elif name == "bar-chart" %}<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>
{%- elif name == "calendar" %}<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/>
{%- elif name == "chevron-left" %}<path d="M15 18l-6-6 6-6"/>
{%- elif name == "chevron-right" %}<path d="M9 18l6-6-6-6"/>
{%- elif name == "arrow-down" %}<path d="M12 5v14"/><path d="m6 13 6 6 6-6"/>
{%- elif name == "alert-circle" %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
{%- endif %}</svg>{% endmacro %}
